[package]
name = "nds_native"
version = "0.0.1-alpha.19"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib", "staticlib"]
[features]
development-http = ["nddev-device-sync-accounts/development-http"]
[dependencies]
nddev-device-sync-vault = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault.git", rev = "673f20f69fae13ebe88d1e8ce2b8e287668a7f10" }
tokio = { version = "1.53", features = ["sync", "rt", "time"] }
zeroize = "1.8"
# ponytail (native bridge): keep the compatible libc 0.2.189 lock until a released
# fix for rust-lang/libc#5601 passes iOS CI; 0.2.190 removes required dyld bindings.
flutter_rust_bridge = { version="=2.13.0",default-features=false,features=["anyhow","dart-opaque","portable-atomic","rust-async","thread-pool"] }
nddev-device-sync-accounts = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev = "7fabebd60063e0f46c815d1ae979490399166d51" }
nddev-device-sync-domain = {git="https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev="d5d16cc3f59aa879136c40d160e756d70c87b5da"}
time = {version="0.3",features=["parsing","wasm-bindgen"]}
tracing = "0.1"
serde_json = "1"
serde = "1"
uuid = { version="1.27", features=["v4", "v7"] }
nddev-device-sync-agent = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-agent", rev = "06dd8ce00e0cde6083109665b812f3011192e398" }
nddev-device-sync-sysinfo = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-sysinfo", rev = "7a18e05f8a1351988af6903c588b0b3ec776c2b0" }
nddev-device-sync-clipboard = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-clipboard", rev = "c90c55eec6dd7be992055256c5957894a1713a25" }
nddev-device-sync-cleaner = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-cleaner", rev = "1c1a14dddca3d06456b5abef30570cdb3650aac8" }
nddev-device-sync-updater = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-updater", rev = "f228b0da9fa737454bd4334f442194f615d56586" }
nddev-device-sync-gds = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-gds", rev = "ecbfb40eeeed21c8e53794f4caff603cee226d32" }
nddev-device-sync-rds = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-rds", rev = "9f12f64578722f808935ee1ded1c0246a248945d" }
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "4b8dfb54168db648f76fb39d2d0cfb1ba7133a9b", features = ["client-traces"] }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
jni-legacy = { package = "jni", version = "0.21.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen="=0.2.129"
wasm-bindgen-futures="=0.4.79"
js-sys="=0.3.106"
uuid = { version="1.27",features=["js"] }
