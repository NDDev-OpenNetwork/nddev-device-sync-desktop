[package]
name = "nds_native"
version = "0.0.1-alpha.15"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib", "staticlib"]
[features]
development-http = ["nddev-device-sync-accounts/development-http"]
[dependencies]
nddev-device-sync-vault = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault.git", rev = "b007cd3d16d6105c978a54b6d015e5627583a67a" }
tokio = { version = "1.53", features = ["sync", "rt", "time"] }
zeroize = "1.8"
# ponytail (native bridge): keep the compatible libc 0.2.189 lock until a released
# fix for rust-lang/libc#5601 passes iOS CI; 0.2.190 removes required dyld bindings.
flutter_rust_bridge = "=2.13.0"
nddev-device-sync-accounts = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev = "66795c6dfc074675082b0f80e6d0681693388618" }
nddev-device-sync-domain = {git="https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev="e87368c53bd524caeabc1e14743c96fcfd87da77"}
time = {version="0.3",features=["parsing"]}
tracing = "0.1"
nddev-device-sync-agent = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-agent", rev = "9c3457f237fa299a8072a6884a6af35dd05da830" }
nddev-device-sync-sysinfo = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-sysinfo", rev = "7a18e05f8a1351988af6903c588b0b3ec776c2b0" }
nddev-device-sync-clipboard = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-clipboard", rev = "035751a2f8b830add428b588bcf8dca53d327945" }
nddev-device-sync-cleaner = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-cleaner", rev = "1c1a14dddca3d06456b5abef30570cdb3650aac8" }
nddev-device-sync-updater = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-updater", rev = "f228b0da9fa737454bd4334f442194f615d56586" }
nddev-device-sync-gds = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-gds", rev = "ecbfb40eeeed21c8e53794f4caff603cee226d32" }
nddev-device-sync-rds = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-rds", rev = "9f12f64578722f808935ee1ded1c0246a248945d" }
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "863a0caad5a06a450a0d99a23675bfb5b5959b2e" }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
jni-legacy = { package = "jni", version = "0.21.1" }
