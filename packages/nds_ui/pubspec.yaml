name: nds_ui
description: Shared NDDev OpenNetwork identity presentation for native clients.
version: 0.0.1-alpha.9
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  nds_native:
    path: ../nds_native
  nddev_opennetwork_design_system:
    git:
