name: NDS checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 4
jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifact: build/linux/x64/debug/bundle
          - os: macos-15
            target: macos
            artifact: build/macos/Build/Products/Debug
          - os: macos-15-intel
            target: macos
            artifact: build/macos/Build/Products/Debug
          - os: windows-2022
            target: windows
            artifact: build/windows/x64/runner/Debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -S vendor/design-system/tools/generate_launchers.py --desktop . --verify
      - run: python scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libclang-dev libssl-dev libx11-dev nasm
      - name: Native macOS targets
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.99.0 aarch64-apple-darwin x86_64-apple-darwin
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_ui
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_native
      - run: flutter analyze --no-pub
      - run: python scripts/build.py ${{ matrix.target }} --debug
      - run: python scripts/check-artifact.py '${{ matrix.artifact }}' --native-source-commit '${{ github.sha }}'
      - run: python scripts/build-provenance.py '${{ matrix.artifact }}' --output build/nds-build-provenance.json
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.58.0'
      - run: python scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Native library build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libclang-dev libssl-dev libx11-dev nasm
      - run: cargo install --locked --version 1.0.127 cargo-expand
      - name: Install verified bridge generator
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.13.0.tgz -o "$RUNNER_TEMP/frb.tgz"
          echo "1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b  $RUNNER_TEMP/frb.tgz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/frb"
          tar -xf "$RUNNER_TEMP/frb.tgz" -C "$RUNNER_TEMP/frb"
          echo "$RUNNER_TEMP/frb" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_ui
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_native
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: just generated-check
      - run: just check
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --desktop . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --desktop . --verify
  quality:
    if: always()
    needs: [builds, contracts]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.builds.result }}' = success && test '${{ needs.contracts.result }}' = success
